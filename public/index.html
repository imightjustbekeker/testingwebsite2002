<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Groq Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #webgl-canvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            display: none;
        }

        /* Upgraded Lyrics Viewport */
        #lyrics-viewport {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 90%;
            max-width: 900px;
            height: 150px;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lyrics-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            white-space: nowrap;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .word {
            font-size: 5.5vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: rgba(255, 255, 255, 0.15);
            transform: scale(0.85);
            transition: color 0.15s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
            filter: blur(2px);
        }

        /* Active word popping state */
        .word.active {
            color: #ffffff;
            transform: scale(1.15);
            filter: blur(0px);
            text-shadow: 0px 0px 40px rgba(255, 255, 255, 0.6);
        }

        /* Out of focus words that passed by */
        .word.passed {
            color: rgba(255, 255, 255, 0.04);
            transform: scale(0.75) translateY(-10px);
            filter: blur(4px);
        }

        /* Setup UI Layer */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #050505;
            transition: opacity 0.4s ease;
        }

        .upload-box {
            border: 2px dashed #222;
            padding: 50px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-box:hover { 
            border-color: #444; 
            background: #080808;
        }

        input[type="file"] { display: none; }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            display: none;
            letter-spacing: 1px;
        }

        #status-text {
            margin-top: 20px;
            color: #666;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <h2>Drop Track Here</h2>
            <p>Select audio file to process (.mp3, .wav)</p>
            <input type="file" id="file-input" accept="audio/*">
        </div>
        <div id="status-text"></div>
        <button id="play-btn">LAUNCH PARSE ENGINE</button>
    </div>

    <canvas id="webgl-canvas"></canvas>
    
    <div id="lyrics-viewport">
        <div id="lyrics-container"></div>
    </div>

    <audio id="audio-source"></audio>

    <script>
        let lyricTimestamps = [];
        let audioContext, analyser, dataArray;
        const uiLayer = document.getElementById('ui-layer');
        const statusText = document.getElementById('status-text');
        const playBtn = document.getElementById('play-btn');
        const fileInput = document.getElementById('file-input');
        const audio = document.getElementById('audio-source');
        const container = document.getElementById('lyrics-container');
        const canvas = document.getElementById('webgl-canvas');

        // --- 1. FILE UPLOAD & EDGE RUNTIME FETCH ---
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('drop-zone').style.display = 'none';
            statusText.innerText = "Routing stream through Groq LPU context...";

            audio.src = URL.createObjectURL(file);

            const formData = new FormData();
            formData.append('audio', file);

            try {
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                lyricTimestamps = data.words;
                statusText.innerText = "Token alignment mapping complete.";
                playBtn.style.display = 'block';

                lyricTimestamps.forEach((item, index) => {
                    const span = document.createElement('span');
                    span.textContent = item.word;
                    span.className = 'word';
                    span.id = `word-${index}`;
                    container.appendChild(span);
                });

            } catch (err) {
                statusText.innerText = "Pipeline Interrupted: " + err.message;
                statusText.style.color = "#ff3333";
            }
        });

        // --- 2. EXECUTION ENGINE INIT ---
        playBtn.addEventListener('click', () => {
            uiLayer.style.opacity = '0';
            setTimeout(() => uiLayer.style.display = 'none', 400);
            canvas.style.display = 'block';
            
            initAudio();
            if (audioContext.state === 'suspended') audioContext.resume();
            audio.play();
            
            initWebGL();
            animate();
        });

        // --- 3. AUDIO FREQUENCY SAMPLING ---
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // --- 4. ADVANCED WEBGL WAVE FIELD ---
        let scene, camera, renderer, particleGeometry, particles;
        const countX = 60;
        const countY = 60;
        let positions, initialZ;

        function initWebGL() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 35, 75);
            camera.lookAt(new THREE.Vector3(0, 0, 0));

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const numParticles = countX * countY;
            positions = new Float32Array(numParticles * 3);
            initialZ = new Float32Array(numParticles);

            let i = 0;
            const separation = 3.5;
            
            for (let ix = 0; ix < countX; ix++) {
                for (let iy = 0; iy < countY; iy++) {
                    positions[i] = (ix * separation) - ((countX * separation) / 2); // X
                    positions[i + 1] = 0;                                           // Y
                    positions[i + 2] = (iy * separation) - ((countY * separation) / 2); // Z
                    
                    initialZ[i / 3] = positions[i + 2];
                    i += 3;
                }
            }

            particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.35,
                transparent: true,
                opacity: 0.4
            });

            particles = new THREE.Points(particleGeometry, material);
            scene.add(particles);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 5. HIGH-REFRESH UNIFIED SYNCHRONIZATION LOOP ---
        let clock = new THREE.Clock();
        let lastActiveIndex = -1;

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            let bassFactor = 0;

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                const bassVal = dataArray.slice(0, 4).reduce((a, b) => a + b) / 4;
                bassFactor = bassVal / 255; // Normalized value between 0 and 1
            }

            // Animate 3D Wave Field based on Time + Bass Amplitude
            const positionAttribute = particleGeometry.getAttribute('position');
            let index = 0;

            for (let ix = 0; ix < countX; ix++) {
                for (let iy = 0; iy < countY; iy++) {
                    // Generate layered mathematical waves
                    const wave1 = Math.sin((ix * 0.15) + (elapsedTime * 2.0));
                    const wave2 = Math.cos((iy * 0.15) + (elapsedTime * 1.5));
                    
                    // Base amplitude gets multiplied significantly when the bass kicks hard
                    const amplitude = 3.0 + (bassFactor * 12.0);
                    
                    // Write new height data directly to the WebGL vertex buffer
                    positionAttribute.setY(index, (wave1 + wave2) * amplitude);
                    
                    index++;
                }
            }
            positionAttribute.needsUpdate = true;
            
            // Camera subtle floating movement
            camera.position.x = Math.sin(elapsedTime * 0.2) * 10;

            // --- KINETIC LYRIC SYSTEM RENDERING ---
            const currentTime = audio.currentTime;
            let currentActiveIndex = -1;

            for (let i = 0; i < lyricTimestamps.length; i++) {
                const item = lyricTimestamps[i];
                if (currentTime >= item.start && currentTime <= item.end) {
                    currentActiveIndex = i;
                    break;
                }
            }

            // If no exact match is found, preserve the last known active word until the next boundary hits
            if (currentActiveIndex === -1) {
                for (let i = 0; i < lyricTimestamps.length; i++) {
                    if (currentTime > lyricTimestamps[i].end && (i === lyricTimestamps.length - 1 || currentTime < lyricTimestamps[i+1].start)) {
                        currentActiveIndex = i;
                        break;
                    }
                }
            }

            // Update DOM states and reposition container if index shifted
            if (currentActiveIndex !== -1) {
                lyricTimestamps.forEach((_, i) => {
                    const element = document.getElementById(`word-${i}`);
                    if (i === currentActiveIndex) {
                        element.className = 'word active';
                    } else if (i < currentActiveIndex) {
                        element.className = 'word passed';
                    } else {
                        element.className = 'word';
                    }
                });

                // Calculate horizontal shift offset to keep the current word perfectly centered
                const activeElement = document.getElementById(`word-${currentActiveIndex}`);
                if (activeElement && currentActiveIndex !== lastActiveIndex) {
                    const offset = activeElement.offsetLeft + (activeElement.offsetWidth / 2);
                    container.style.transform = `translateX(calc(50vw - ${offset}px))`;
                    lastActiveIndex = currentActiveIndex;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
